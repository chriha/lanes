name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o bin/lanes .
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
  bench:
    # The startup gate (docs/design.md § Startup): the head may be at most 2x the base, both measured on this runner.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      BENCH_PKG: ./internal/ui
      BENCH_FILE: internal/ui/startup_bench_test.go
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build benchmarks
        # The head's benchmark file is built against the base's code too; when it does not compile there, the
        # check reports "no comparison" instead of failing.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          go test -c -o "$RUNNER_TEMP/head.test" "$BENCH_PKG"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          cp "$BENCH_FILE" "$RUNNER_TEMP/base/$BENCH_FILE"
          (cd "$RUNNER_TEMP/base" && go test -c -o "$RUNNER_TEMP/base.test" "$BENCH_PKG") ||
            echo "the benchmark did not build on the base"
      - name: benchmark
        # Head and base runs alternate, so runner noise and warm-up hit both alike instead of the one run first.
        run: |
          touch "$RUNNER_TEMP/head.txt" "$RUNNER_TEMP/base.txt"
          for i in 1 2 3 4 5 6; do
            for side in head base; do
              [ -x "$RUNNER_TEMP/$side.test" ] || continue
              "$RUNNER_TEMP/$side.test" -test.run '^$' -test.bench TimeToFirstList -test.count=1 \
                >> "$RUNNER_TEMP/$side.txt" 2>&1 || echo "the benchmark did not run on the $side"
            done
          done
          cat "$RUNNER_TEMP/head.txt" "$RUNNER_TEMP/base.txt"
      - name: compare
        run: scripts/bench-check.sh "$RUNNER_TEMP/base.txt" "$RUNNER_TEMP/head.txt" | tee -a "$GITHUB_STEP_SUMMARY"
