version: 2

project_name: lanes

before:
  hooks:
    - go mod download

builds:
  - id: lanes
    main: .
    binary: lanes
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Tag }}

archives:
  - id: lanes
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

brews:
  - name: lanes
    repository:
      owner: chriha
      name: homebrew-lanes
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/chriha/lanes
    description: Vim-style terminal UI for work items, with actions run in tmux sessions
    license: MIT
    dependencies:
      - name: tmux
    test: |
      assert_match version.to_s, shell_output("#{bin}/lanes --version")

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^style:'
